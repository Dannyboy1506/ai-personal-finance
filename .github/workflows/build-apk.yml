name: Build Android APK

# Builds a debug APK of artifacts/fintech-app directly on GitHub's runners —
# no EAS account, no Expo login, no paid service required.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on pushes to main that touch the app. Either way, download
# the finished .apk from the workflow run's "Artifacts" section when it's done
# (top of the run page, a few minutes after it starts).
#
# Optional: set an EXPO_PUBLIC_API_BASE_URL repository secret (Settings →
# Secrets and variables → Actions) pointing at your deployed artifacts/api-server
# to enable Tier 2/3 AI features in the built app. Without it, the app still
# builds and runs fine — Tier 1 (on-device parsing) always works, Tier 2/3
# just won't have a backend to call.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "artifacts/fintech-app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java (required by the Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Write app env
        working-directory: artifacts/fintech-app
        run: |
          echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
          if [ -z "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "::notice::EXPO_PUBLIC_API_BASE_URL secret is not set — building with Tier 1 (on-device) only."
          fi

      - name: Generate native Android project (expo prebuild)
        working-directory: artifacts/fintech-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/fintech-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: artifacts/fintech-app/android
        run: chmod +x ./gradlew

      # Debug builds are signed automatically with Android's built-in debug
      # key, so this needs zero secrets and the .apk installs immediately via
      # `adb install` or by opening it on-device. See the commented section
      # below for how to switch to a signed release build once you have a
      # real keystore.
      - name: Build debug APK
        working-directory: artifacts/fintech-app/android
        run: ./gradlew assembleDebug --no-daemon

      # ── OPTIONAL: signed release build ─────────────────────────────────────
      # Uncomment once you've generated a real keystore (`keytool -genkeypair
      # ...`) and added these as repository secrets. Never commit a keystore
      # file to the repo.
      #
      # - name: Decode signing keystore
      #   working-directory: artifacts/fintech-app/android
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
      #
      # - name: Build signed release APK
      #   working-directory: artifacts/fintech-app/android
      #   env:
      #     ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #   run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK and write summary
        working-directory: artifacts/fintech-app/android
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "### 📦 Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK:** \`$APK_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size:** $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signing:** debug key (side-load only, not Play Store-ready)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from this run's **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fintech-app-debug-apk
          path: artifacts/fintech-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
