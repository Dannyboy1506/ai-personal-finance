name: Build Android APK

# Builds a debug APK of artifacts/fintech-app directly on GitHub's runners —
# no EAS account, no Expo login, no paid service required.
#
# Trigger it manually from the Actions tab ("Run workflow"), or it runs
# automatically on pushes to main that touch the app. Either way, download
# the finished .apk from the workflow run's "Artifacts" section when it's done
# (top of the run page, a few minutes after it starts).
#
# Optional: set an EXPO_PUBLIC_API_BASE_URL repository secret (Settings →
# Secrets and variables → Actions) pointing at your deployed artifacts/api-server
# to enable Tier 2/3 AI features in the built app. Without it, the app still
# builds and runs fine — Tier 1 (on-device parsing) always works, Tier 2/3
# just won't have a backend to call.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "artifacts/fintech-app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install workspace dependencies
        # Not --frozen-lockfile: there's no committed pnpm-lock.yaml that's
        # actually in sync with package.json right now (that's the root
        # cause of the ERR_PNPM_LOCKFILE_CONFIG_MISMATCH failures), so a
        # frozen install just fails outright rather than building anything.
        # Plain install lets pnpm resolve a consistent lockfile on the fly.
        # Once a real pnpm-lock.yaml is committed (run `pnpm install` locally
        # and push the result), switch this back to --frozen-lockfile for
        # reproducible builds.
        run: pnpm install

      - name: Check Expo dependency compatibility
        working-directory: artifacts/fintech-app
        run: |
          npx expo install --check || echo "::warning::Some dependencies may not match this Expo SDK version — see log above. Run 'npx expo install --fix' locally to correct them."
        continue-on-error: true

      - name: Setup Java (required by the Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Write app env
        working-directory: artifacts/fintech-app
        run: |
          echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
          if [ -z "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
            echo "::notice::EXPO_PUBLIC_API_BASE_URL secret is not set — building with Tier 1 (on-device) only."
          fi

      - name: Generate native Android project (expo prebuild)
        working-directory: artifacts/fintech-app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/fintech-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: artifacts/fintech-app/android
        run: chmod +x ./gradlew

      # Ensure a debug keystore exists explicitly rather than relying on
      # implicit auto-generation. With no release signing configured (see
      # below), Expo's generated build.gradle falls back to this same
      # keystore for the release build type — so this is what makes
      # assembleRelease produce an installable APK with zero secrets.
      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # IMPORTANT: assembleDebug is intentionally NOT used here. React
      # Native's debug build type defaults to loading JS from a live Metro
      # server on localhost:8081 instead of bundling it into the APK — fine
      # for local development with a cable and `expo start`, useless for a
      # standalone APK built in CI with no dev server anywhere nearby (this
      # is exactly what caused every install to hang on the splash screen,
      # regardless of any JS-level fix — no JS was ever loading at all).
      # assembleRelease bundles the JS directly by default. It still needs
      # signing to be installable; with no real keystore configured (see the
      # optional block below), it falls back to the debug keystore ensured
      # above — self-signed, fine for side-loading, not Play Store-ready.
      - name: Build release APK
        working-directory: artifacts/fintech-app/android
        run: ./gradlew assembleRelease --no-daemon

      # ── OPTIONAL: real release signing ──────────────────────────────────────
      # Uncomment once you've generated a real keystore (`keytool -genkeypair
      # ...`) and added these as repository secrets. Never commit a keystore
      # file to the repo. With this in place, assembleRelease above will use
      # it instead of falling back to the debug keystore.
      #
      # - name: Decode signing keystore
      #   working-directory: artifacts/fintech-app/android
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
      #
      # - name: Configure release signing
      #   working-directory: artifacts/fintech-app/android
      #   env:
      #     ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      #     ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      #   run: echo "Wire these into app/build.gradle's signingConfigs.release block"

      - name: Locate APK and write summary
        working-directory: artifacts/fintech-app/android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "### 📦 Build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK:** \`$APK_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Size:** $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Signing:** debug keystore fallback (side-load only, not Play Store-ready)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **JS bundle:** embedded (production mode, no Metro/dev server needed)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from this run's **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fintech-app-release-apk
          path: artifacts/fintech-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
